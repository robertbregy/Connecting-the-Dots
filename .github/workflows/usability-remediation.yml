name: Usability audit remediation
on:
  push:
    branches: ['fix/usability-audit-20261022']
permissions:
  contents: read
concurrency:
  group: usability-remediation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[usability artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: timeout 150 npm ci --no-audit --no-fund --prefer-offline --fetch-retries=1 --fetch-timeout=30000
      - name: Build and verify the exact inspected candidate
        id: prepare
        run: python3 scripts/prepare_usability_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-static
          path: |
            audit-usability/report.json
            docs/usability-remediation-review.json
          if-no-files-found: ignore
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [focused, exports, navigation, accessibility]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed browser dependencies
        run: |
          timeout 150 npm ci --no-audit --no-fund --prefer-offline --fetch-retries=1 --fetch-timeout=30000
          timeout 180 npm install --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run every check independently against the exact candidate
        env:
          CTD_TEST_BASE: http://127.0.0.1:8123/
          CTD_AUDIT_OUTPUT: audit-20261018
          CTD_ECONOMICS_QA: audit-economics
          CTD_CITY_TEST_BASE: http://127.0.0.1:8123/
          GITHUB_SHA: ${{ needs.build.outputs.candidate }}
          AUDIT_GROUP: ${{ matrix.group }}
        run: python3 scripts/verify_usability_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usability-${{ matrix.group }}
          path: |
            audit-group-status.json
            audit-logs/
            audit-usability/
            audit-20261018/
            audit-20261018-cold/
            audit-economics/
            audit-deeplinks/
            audit-ia-b2/
            audit-*.json
            audit-*.png
            dist/city-namespace-qa/
          if-no-files-found: ignore
          retention-days: 30
