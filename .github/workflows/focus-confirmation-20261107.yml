name: Confirm focus findings and isolated CSS candidate
on:
  push:
    branches: ['qa/focus-confirmation-20261107']
    paths: ['qa/focus-confirmation-20261107.cjs', 'qa/focus-visibility-candidate.css', '.github/workflows/focus-confirmation-20261107.yml']
permissions:
  contents: read
jobs:
  focus-confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install controlled browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual focused elements before and after the candidate
        run: node qa/focus-confirmation-20261107.cjs
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: focus-confirmation-${{ github.sha }}
          path: audit-focus-confirmation/
          if-no-files-found: error
