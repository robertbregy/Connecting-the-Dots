name: Assemble reviewed UX focus release 0.7.100
on:
  push:
    branches: ['work/ux-release-v07100-20261107']
    paths: ['scripts/prepare_ux_focus_v07100.py', 'scripts/audit_focus_reflow.cjs', '.github/workflows/assemble-ux-focus-v07100.yml', '.github/workflows/focus-reflow-regression.yml']
permissions:
  contents: write
concurrency:
  group: ctd-assemble-ux-focus-v07100
  cancel-in-progress: true
jobs:
  assemble:
    if: github.ref == 'refs/heads/work/ux-release-v07100-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install established build and browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Assemble exact CSS fixes, preserve research and verify repeated build
        run: python3 scripts/prepare_ux_focus_v07100.py
      - name: Retain assembly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ux-focus-assembly-${{ github.sha }}
          path: |
            ux-assembly-result.json
            docs/audits/2026-11-07/ux-focus-release-v0.7.100.json
            audit-usability/report.json
          if-no-files-found: warn
