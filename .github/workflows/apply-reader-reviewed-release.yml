name: Validate reviewed reader-first release

on:
  push:
    branches: [feat/sitewide-reader-paths-20261021]
    paths:
      - .github/workflows/apply-reader-reviewed-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reader-reviewed-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the exact locally reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          baseline='a4a9ef459b037610837bc5e547f387f1c0edfb37'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          advanced=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          allowed={'.github/reader-release/part-01.b64','.github/reader-release/part-02.b64','.github/workflows/apply-reader-reviewed-release.yml'}
          assert set(advanced)<=allowed,('Source branch advanced',advanced)
          payload=''.join(Path('.github/reader-release/part-%02d.b64'%i).read_text().strip() for i in [1,2])
          data=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(data).hexdigest()=='ef1a7a262eece022b177f4688d6ec7612c6e0f36ef6485f57ba111274f64b219','Transport checksum mismatch'
          entries=json.loads(data)
          assert len(entries)==23
          outputs=[]
          for item in entries:
              target=Path(item['path']); source=Path(item['source'])
              assert not target.is_absolute() and '..' not in target.parts
              before=source.read_text() if source.exists() else ''
              assert hashlib.sha256(before.encode()).hexdigest()==item['before'],('Stale source',str(source))
              after=before
              for start,end,text in reversed(item['edits']):
                  assert 0<=start<=end<=len(before)
                  after=after[:start]+text+after[end:]
              assert hashlib.sha256(after.encode()).hexdigest()==item['after'],('Wrong result',str(target))
              outputs.append((target,after))
          for target,text in outputs:
              target.parent.mkdir(parents=True,exist_ok=True);target.write_text(text)
          for name in allowed:Path(name).unlink()
          print('REVIEWED_SOURCE_DELTA_VERIFIED',len(outputs))
          PY
          git add -A
          mkdir -p artifacts/reader-review
      - name: Create immutable source object without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/reader_git_objects.py <<'PY'
          import os,sys,json,base64,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; original=os.environ['GITHUB_SHA']
          cachepath=Path('/tmp/reader-objects.json')
          cache=json.loads(cachepath.read_text()) if cachepath.exists() else {}
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          def post(endpoint,data):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+endpoint,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r:return json.load(r)
          paths=git('diff','--cached','--name-only','--diff-filter=ACDMRT').splitlines();entries=[]
          for p in paths:
              if not Path(p).exists():entries.append({'path':p,'mode':'100644','type':'blob','sha':None});continue
              blob=git('rev-parse',':'+p)
              if blob not in cache:
                  content=subprocess.check_output(['git','show',':'+p])
                  got=post('blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})['sha']
                  assert got==blob,(p,got,blob);cache[blob]=True;cachepath.write_text(json.dumps(cache))
              mode=git('ls-files','--stage','--',p).split()[0]
              entries.append({'path':p,'mode':mode,'type':'blob','sha':blob})
          tree=post('trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          assert tree==git('write-tree'),'Remote tree differs from reviewed worktree'
          kind=sys.argv[1];parent=original if kind=='source' else os.environ['CTD_READER_SOURCE_SHA']
          message='Implement reader-first v0.7.92 architecture' if kind=='source' else 'Build verified reader-first v0.7.92 [skip build]'
          commit=post('commits',{'message':message,'tree':tree,'parents':[parent]})['sha']
          out={'kind':kind,'sha':commit,'tree':tree,'parent':parent,'branchExpectedSHA':original,'changedFiles':paths}
          Path('artifacts/reader-review/'+kind+'-commit.json').write_text(json.dumps(out,indent=2)+'\n')
          if kind=='source':
              with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CTD_READER_SOURCE_SHA='+commit+'\n')
          print('IMMUTABLE_READER_OBJECT',json.dumps(out))
          PY
          python3 /tmp/reader_git_objects.py source
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Build and validate exact reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$CTD_READER_SOURCE_SHA" python3 build.py | tee artifacts/reader-review/build.log
          node scripts/verify_ia_b2_parity.cjs | tee artifacts/reader-review/parity.log
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
          python3 scripts/test_aps_current_analytics.py
          sha256sum downloads/connecting-the-dots-data-pack-v0.7.92.zip > /tmp/reader-pack.sha256
      - name: Functional reading journeys and automated accessibility
        run: node scripts/reader_paths_review.cjs
      - name: Existing navigation and deep-link regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/reader-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          node scripts/audit_browser_20261010.js
          CTD_TEST_BASE=http://127.0.0.1:8123/ node scripts/audit_ia_b2.cjs
          CTD_TEST_BASE=http://127.0.0.1:8123/ node scripts/audit_legacy_deeplinks.cjs
          CTD_TEST_BASE=http://127.0.0.1:8123/ CTD_ECONOMICS_QA=artifacts/reader-review/economics node scripts/audit_economics_order.cjs
      - name: Verify reproducible regeneration
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$CTD_READER_SOURCE_SHA" python3 build.py | tee artifacts/reader-review/rebuild.log
          sha256sum -c /tmp/reader-pack.sha256
          node scripts/verify_ia_b2_parity.cjs
      - name: Create verified build object without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html en it de fr applications behind-the-round inside-the-round explorer research data downloads sitemap.xml src/index.web.html package.json package-lock.json CITATION.cff
          python3 /tmp/reader_git_objects.py build
          echo 'All gates passed. Branch promotion requires a separate expected-SHA update.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-reader-release-${{ github.sha }}
          path: |
            artifacts/reader-review/
            audit-ia-b2/
            audit-deeplinks/
            audit-*.png
          retention-days: 14
          if-no-files-found: error
