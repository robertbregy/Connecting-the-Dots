name: City namespace editorial release gate
on:
  push:
    branches: [editorial/city-models-20261017]
    paths:
      - data/city_namespace_editorial.json
      - scripts/city_namespace_editorial.py
      - scripts/prepare_city_namespace_release.py
      - scripts/audit_city_namespace.cjs
      - .github/workflows/city-namespace-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: city-namespace-editorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-and-verify:
    if: ${{ github.ref_name == 'editorial/city-models-20261017' && !contains(github.event.head_commit.message || '', '[skip city]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply source-reviewed versioned migration
        run: |
          python3 -m py_compile scripts/city_namespace_editorial.py scripts/prepare_city_namespace_release.py
          python3 scripts/prepare_city_namespace_release.py
          npm ci
          python3 build.py
          node scripts/verify_ia_b2_parity.cjs
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
          python3 scripts/aps_observatory.py verify-baseline
      - name: Verify reproducibility and immutable evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd()
          base='b7d3b0f39e4addfdaba8c66431ba6529ec67a73b'
          pub=json.loads((root/'publication.json').read_text())
          pack=root/pub['currentDataPackPath']
          checksum=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          before=checksum(pack)
          historic={str(p):checksum(p) for p in (root/'downloads').glob('*.zip') if p!=pack}
          subprocess.run(['python3','build.py'],check=True)
          assert checksum(pack)==before,'Non-deterministic new data archive'
          for path,value in historic.items():
              assert checksum(pathlib.Path(path))==value,'Historical archive changed: '+path
          for path in ['data/application_2026_snapshot.json','data/applications_2026_aps_official_listing.csv','data/iana_snapshot.json','data/behind_round_stories.json','data/field_investigations.json','CITATION.cff']:
              original=subprocess.check_output(['git','show',base+':'+path])
              assert (root/path).read_bytes()==original,'Frozen or unrelated evidence changed: '+path
          print('CITY_NAMESPACE_DATA_AND_ARCHIVE_PARITY_OK',before)
          PY
      - name: Install browser and accessibility tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Native UI and legacy regression gates
        run: |
          python3 -m http.server 8128 --bind 127.0.0.1 >/tmp/ctd-city-server.log 2>&1 &
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/ctd-city-deep-server.log 2>&1 &
          sleep 2
          node scripts/audit_city_namespace.cjs >/tmp/city-namespace-browser.log 2>&1 &
          CITY_PID=$!
          node scripts/audit_ia_b2.cjs >/tmp/city-b2-browser.log 2>&1 &
          B2_PID=$!
          node scripts/deep_audit_20261011.js >/tmp/city-deep-browser.log 2>&1 &
          DEEP_PID=$!
          failed=0
          wait "$CITY_PID" || failed=1
          wait "$B2_PID" || failed=1
          wait "$DEEP_PID" || failed=1
          cat /tmp/city-namespace-browser.log /tmp/city-b2-browser.log /tmp/city-deep-browser.log
          test "$failed" = 0
      - name: Verify A-to-B continuity including previously reviewed Field Notes
        run: |
          git worktree add --detach ../baseline safety/main-v0.7.78-before-b2-switch-20261013
          python3 scripts/audit_content_continuity.py
      - name: Commit checked sources and generated files to this branch only
        run: |
          test "$GITHUB_REF_NAME" = editorial/city-models-20261017
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add docs/CITY_NAMESPACE_REVIEW_2026-10-17.md downloads/connecting-the-dots-data-pack-v0.7.83.zip downloads/connecting-the-dots-data-pack-v0.7.83.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified city-domain editorial build v0.7.83 [skip build] [skip city]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve browser and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-namespace-editorial-qa
          path: |
            dist/city-namespace-qa/
            audit-ia-b2/
            audit-independent-20261011.json
            audit-independent-*.png
            content-continuity-audit.json
            /tmp/city-namespace-browser.log
            /tmp/city-b2-browser.log
            /tmp/city-deep-browser.log
          if-no-files-found: ignore
