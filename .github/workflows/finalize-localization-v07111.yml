name: Finalize v0.7.111 Legal localization sweep

on:
  push:
    branches: ['fix/v0.7.111-localization-sweep']
    paths: ['.github/workflows/finalize-localization-v07111.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare localized v0.7.111 source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/prepare_localization_v07111.py
      - name: Seed exact review path
        run: cp docs/editorial-review-2026-11-12-v0.7.110.json docs/editorial-review-2026-11-12-v0.7.111.json
      - name: Regenerate candidate
        run: python3 build.py
      - name: Record explicit reviewed hashes
        run: node scripts/finalize_localization_review_v07111.cjs --record-reviewed-candidate
      - name: Verify full candidate
        run: |
          python3 scripts/release_check.py
          node scripts/verify_ia_b2_parity.cjs
          node scripts/validate_multilingual.js
          node scripts/validate_discovery.cjs
          python3 scripts/test_public_surface.py
          node scripts/test_reading_controls.cjs
      - name: Commit reviewed candidate if branch tip is unchanged
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD" || { echo "::error::Branch advanced; refusing stale write."; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'v0.7.111: localize Legal labels and deduplicate sources [skip build]'
          git push origin "HEAD:$BRANCH"
