name: Diagnose native homepage fragment navigation
on:
  push:
    branches: [diagnostic/home-nojs-v0106]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cd5ee9b22d9febb4707aebecbe7b93b8ad355445
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install the established browser runtime
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Observe the committed candidate without JavaScript
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/home-nojs-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          node - <<'JS'
          'use strict'; const fs=require('node:fs'); const {chromium}=require('playwright');
          const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const base='http://127.0.0.1:8123/it/';const out='home-nojs-diagnostic';fs.mkdirSync(out,{recursive:true});
          const report={candidate:'cd5ee9b22d9febb4707aebecbe7b93b8ad355445',variants:[]};
          const original=fs.readFileSync('assets/home-editorial.css','utf8');
          (async()=>{const browser=await chromium.launch({headless:true});try{
          for(const variant of ['baseline','native-margin-experiment']){
          fs.writeFileSync('assets/home-editorial.css',original+(variant==='baseline'?'':"\n/* Diagnostic experiment only: keep the native destination below both sticky bars. */\n.no-js #how-part-2{scroll-margin-top:calc(var(--topbar-height) + 160px)}\n"));
          const context=await browser.newContext({javaScriptEnabled:false,viewport:{width:390,height:900}});const page=await context.newPage();
          const state=()=>page.evaluate(()=>{const n=document.getElementById('how-part-2'),r=n.getBoundingClientRect();return {url:location.href,scrollY,top:r.top,bottom:r.bottom,height:r.height,margin:getComputedStyle(n).scrollMarginTop,navBottom:document.querySelector('.iaPrimaryNav').getBoundingClientRect().bottom,viewport:innerHeight,ready:document.readyState}});
          await page.goto(base,{waitUntil:'load'});await page.locator('.heroPrimary').click();
          await page.waitForURL(url=>url.searchParams.get('tab')==='how'&&url.hash==='#how-part-2');
          const result={variant,afterWaitForURL:await state()};
          try{await page.waitForFunction(()=>{let n=document.getElementById('how-part-2');if(!n||!n.getBoundingClientRect().height)return false;for(let p=n;p;p=p.parentElement)if(p.tagName==='DETAILS'&&!p.open)return false;const r=n.getBoundingClientRect();return r.top>=0&&r.top<innerHeight},null,{timeout:5000});result.originalCheck='passed'}catch(e){result.originalCheck=e.message}
          result.afterCheck=await state();await pause(2000);result.afterTwoSeconds=await state();
          await page.screenshot({path:out+'/'+variant+'.png'});report.variants.push(result);console.log('NOJS_DIAGNOSTIC '+JSON.stringify(result));
          await context.close();}
          }finally{await browser.close();fs.writeFileSync('assets/home-editorial.css',original);fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2)+'\n')}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Save diagnostic observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home-nojs-diagnostic
          path: home-nojs-diagnostic/
          if-no-files-found: error
