name: Final A/B editorial and archived-data parity
on:
  push:
    branches:
      - audit/final-a-b-parity-20261013
      - 'feat/**'
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out current B version
        uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - name: Check out frozen A backup
        uses: actions/checkout@v4
        with:
          ref: safety/main-v0.7.78-before-b2-switch-20261013
          path: baseline
          persist-credentials: false
      - name: Compare exact editorial bodies and all technical archive payloads
        working-directory: current
        run: python3 scripts/audit_content_continuity.py
      - name: Preserve detailed content parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-content-continuity-report
          path: current/content-continuity-audit.json
          if-no-files-found: warn
