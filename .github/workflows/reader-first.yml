name: Reader-first navigation and accessibility

on:
  push:
    branches: [reader-first-2026-10-21]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Map current routes and editorial structure
        run: |
          node - <<'JS'
          const fs=require('fs'),{parseHTML}=require('linkedom');
          const {document:d}=parseHTML(fs.readFileSync('it/index.html','utf8'));
          for(const s of d.querySelectorAll('main > section,main > .section')){
            console.log('SECTION',s.id,s.className);
            for(const n of s.querySelectorAll('h2,h3'))console.log(' HEADING',n.id,n.textContent.trim().replace(/\s+/g,' ').slice(0,180));
            for(const a of s.querySelectorAll('.iaCard,.iaHomeCard,.iaHubCard,.iaPathCard'))console.log(' CARD',a.getAttribute('href'),a.textContent.trim().replace(/\s+/g,' ').slice(0,220));
          }
          console.log('HOME',d.querySelector('.iaHomeEntries')?.outerHTML||[...d.querySelectorAll('[class*="iaHome"]')].map(n=>n.outerHTML).join('\n').slice(0,12000));
          console.log('HUB_SAMPLE',d.getElementById('ia-understand')?.outerHTML?.slice(0,16000));
          console.log('BOTTOM',d.body.outerHTML.slice(-3500));
          JS
          python3 - <<'PY'
          from pathlib import Path
          print('SCRIPTS',*[str(p) for p in Path('scripts').iterdir()],sep='\n')
          lines=Path('assets/app.js').read_text().splitlines()
          keys=['function show','function setLang','function openSection','function activate','iaHome','iaHub','ia-understand','dispatchEvent','popstate','hashchange','DOMContentLoaded','function route']
          seen=set()
          for i,line in enumerate(lines):
              if any(key in line for key in keys):
                  for j in range(max(0,i-2),min(len(lines),i+9)):
                      if j not in seen: print(f'APP {j+1}: {lines[j]}');seen.add(j)
          PY
      - name: Check reader-first changes when present
        run: |
          if test -f scripts/install_reader_first.py; then python3 scripts/install_reader_first.py; fi
          if test -f scripts/reconcile_reader_first.cjs; then
            python3 build.py
            node scripts/validate_reader_first.cjs
          fi
