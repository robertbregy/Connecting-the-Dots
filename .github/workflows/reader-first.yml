name: Reader-first publication checks
on:
  push:
    branches: ['feat/reader-first-20261021']
    paths: ['.github/workflows/reader-first.yml', 'scripts/**', 'assets/**', 'data/reader_first.json', 'publication.json', 'docs/reader-first-approval.json']
permissions:
  contents: write
concurrency:
  group: reader-first-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[reader artifacts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Integrate reviewed source changes
        run: |
          python3 scripts/reader_first_compat.py
          python3 scripts/reader_first_install.py
          rm -f docs/reader-first-structure.json docs/reader-first-verification.json
      - name: Build publication
        id: build
        continue-on-error: true
        run: python3 build.py
      - name: Existing static regression tests
        id: static
        continue-on-error: true
        run: |
          node scripts/validate_multilingual.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
      - name: Browser regressions and accessibility
        id: browser
        continue-on-error: true
        run: |
          test -f docs/reader-first-structure.json
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
          node scripts/reader_first_browser.cjs
      - name: Full legacy Economics and mobile body-click regression
        id: legacy
        continue-on-error: true
        env:
          CTD_TEST_BASE: http://127.0.0.1:8128/
          CTD_ECONOMICS_QA: /tmp/reader-first-qa/economics
        run: |
          python3 -m http.server 8128 --bind 127.0.0.1 >/tmp/reader-legacy-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          node scripts/audit_economics_order.cjs
          node scripts/audit_ia_b2.cjs
          node scripts/audit_legacy_deeplinks.cjs
          node scripts/native_governance_browser_qa.cjs
      - name: Prepare exact editorial review candidate
        id: candidate
        if: always()
        continue-on-error: true
        run: |
          test -f docs/reader-first-structure.json
          node scripts/reader_first_review.cjs
      - name: Enforce independent exact-file editorial approval
        id: parity
        if: always()
        continue-on-error: true
        run: node scripts/verify_ia_b2_parity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-first-verification
          path: |
            docs/reader-first*.json
            docs/reader-first*.b64
            /tmp/reader-first-qa/
            audit-ia-b2/
            audit-deeplinks/
          if-no-files-found: ignore
      - name: Save review evidence, promote generated files only after all gates pass
        if: always() && github.event_name == 'push'
        env:
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
          STATIC_OK: ${{ steps.static.outcome == 'success' }}
          BROWSER_OK: ${{ steps.browser.outcome == 'success' }}
          LEGACY_OK: ${{ steps.legacy.outcome == 'success' }}
          REVIEW_OK: ${{ steps.parity.outcome == 'success' }}
          CANDIDATE_OK: ${{ steps.candidate.outcome == 'success' }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" || { echo 'Branch advanced; no files committed.'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test "$BUILD_OK:$STATIC_OK:$BROWSER_OK:$LEGACY_OK:$REVIEW_OK:$CANDIDATE_OK" = 'true:true:true:true:true:true'; then
            git add -A
            message='Verified reader-first publication artifacts [reader artifacts] [skip build]'
          else
            git add -- 'docs/reader-first-*'
            message='Reader-first review evidence; publication not approved [reader artifacts] [skip build]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Fail closed on any unmet publication gate
        if: always()
        env:
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
          STATIC_OK: ${{ steps.static.outcome == 'success' }}
          BROWSER_OK: ${{ steps.browser.outcome == 'success' }}
          LEGACY_OK: ${{ steps.legacy.outcome == 'success' }}
          REVIEW_OK: ${{ steps.parity.outcome == 'success' }}
          CANDIDATE_OK: ${{ steps.candidate.outcome == 'success' }}
        run: test "$BUILD_OK:$STATIC_OK:$BROWSER_OK:$LEGACY_OK:$REVIEW_OK:$CANDIDATE_OK" = 'true:true:true:true:true:true'
