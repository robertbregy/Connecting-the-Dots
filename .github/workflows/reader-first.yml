name: Reader-first navigation and accessibility
on:
  push:
    branches: [reader-first-2026-10-21]
    paths: ['.github/workflows/reader-first.yml', 'scripts/reader-first.patch.04']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: reader-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip reader]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect source delta
        id: source
        run: |
          if test -f scripts/reader-first.patch.04; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Apply the exact source changes tested in run 39615726717
        if: steps.source.outputs.ready == 'true'
        run: |
          cat scripts/reader-first.patch.0[1-4] | base64 --decode | gzip --decompress > /tmp/reader-first.patch
          echo '69da58d5abbcf5b528928b169a4bbb646cced2f1dfeed5b032e524ab5525a5f7  /tmp/reader-first.patch' | sha256sum --check
          git apply --check /tmp/reader-first.patch
          git apply /tmp/reader-first.patch
          echo '95ded81055cc257fdab47a28d6baa0f35eac709e68d57ce45f83073f7e67a9ff  scripts/reader-first-followup.patch' | sha256sum --check
          git apply --exclude=.github/workflows/rebuild.yml --check scripts/reader-first-followup.patch
          git apply --exclude=.github/workflows/rebuild.yml scripts/reader-first-followup.patch
          git diff --exit-code -- .github/workflows
      - name: Build and finalize the inspected editorial review
        if: steps.source.outputs.ready == 'true'
        run: |
          npm ci
          python3 build.py
          node scripts/validate_reader_first.cjs
          python3 scripts/prepare_reader_review.py --finalize --browser-run 39615726717
          node scripts/verify_ia_b2_parity.cjs
      - name: Verify reproducibility, historic archives and manuscript
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,sys
          pub=json.loads(Path('publication.json').read_text())
          files=[Path(pub['currentDataPackPath']),Path('downloads/connecting-the-dots-data-pack.zip')]
          files += [Path('research')/n for n in ['connecting-the-dots-working-paper-v1.md','connecting-the-dots-working-paper-v1.html','index.html']]
          def hashes(): return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          before=hashes();subprocess.run([sys.executable,'build.py'],check=True)
          assert before==hashes(),'Repeated build changed package, archive or manuscript'
          assert before[pub['currentDataPackPath']]=='dba829d230b7e4ff27219c77ecd66a3034361fd49ceaeee4e2f93a549014c843','Package differs from browser-tested build'
          print('READER_REPRODUCIBLE',json.dumps(before))
          PY
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
          node scripts/validate_reader_first.cjs
          python3 scripts/prepare_reader_review.py --finalize --browser-run 39615726717
          node scripts/verify_ia_b2_parity.cjs
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.ready == 'true'
        with:
          name: reader-first-review-39615726717
          run-id: 39615726717
          github-token: ${{ github.token }}
          path: /tmp/reviewed-reader
      - name: Verify browser report and equality of the reviewed page contents
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,tarfile,re,os
          r=json.loads(Path('/tmp/reviewed-reader/ctd-reader-qa/report.json').read_text())
          assert len(r['scenarios'])==302 and not r['issues']
          native=['index.html','it/index.html','en/index.html','de/index.html','fr/index.html']
          checked=0;provenance=0
          with tarfile.open('/tmp/reviewed-reader/reader-built.tar.gz') as t:
              for m in t.getmembers():
                  if m.isfile() and (m.name.startswith(('assets/','applications/','inside-the-round/','behind-the-round/')) or m.name in native):
                      reviewed=t.extractfile(m).read();current=Path(m.name).read_bytes()
                      if m.name in native and reviewed!=current:
                          pattern=re.compile(rb"commit:'([0-9a-f]{40})'")
                          assert pattern.findall(reviewed)==[b'09562f6c758b2e876a3438b7edd96677be319fa2']
                          assert pattern.findall(current)==[os.environ['GITHUB_SHA'].encode()]
                          reviewed=pattern.sub(b"commit:'BUILD_REF'",reviewed)
                          current=pattern.sub(b"commit:'BUILD_REF'",current)
                          provenance+=1
                      assert reviewed==current,'Reviewed content differs: '+m.name
                      checked+=1
          summary={'browserRun':39615726717,'scenarios':302,'issues':0,'matchedRenderedFiles':checked,'truthfulBuildProvenanceChanges':provenance,'humanParticipants':0,'accessibilityConformanceClaim':False}
          Path('docs/reader-first-browser-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('REVIEWED_BROWSER_CONTENT_MATCH',json.dumps(summary))
          PY
      - name: Install pinned browser tools
        if: steps.source.outputs.ready == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run earlier navigation, data, guide and legacy-link regressions
        if: steps.source.outputs.ready == 'true'
        env:
          CTD_TEST_BASE: http://127.0.0.1:8128/
        run: |
          mkdir -p /tmp/reader-final-regression
          python3 -m http.server 8128 --bind 127.0.0.1 > /tmp/reader-final-regression/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          (node scripts/audit_ia_b2.cjs && node scripts/audit_20261018_browser.cjs) > /tmp/reader-final-regression/navigation.log 2>&1 &
          NAV_PID=$!
          (node scripts/audit_economics_order.cjs && node scripts/audit_audience.cjs && node scripts/audit_legacy_deeplinks.cjs) > /tmp/reader-final-regression/content.log 2>&1 &
          CONTENT_PID=$!
          STATUS=0
          wait "$NAV_PID" || STATUS=1
          wait "$CONTENT_PID" || STATUS=1
          tail -n 35 /tmp/reader-final-regression/navigation.log
          tail -n 35 /tmp/reader-final-regression/content.log
          test "$STATUS" -eq 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.ready == 'true'
        with:
          name: reader-first-final-regression-${{ github.run_id }}
          path: |
            /tmp/reader-final-regression/
            /tmp/ctd-audit-20261018/
            /tmp/ctd-economics-order/
            docs/reader-first-browser-summary.json
          retention-days: 7
      - name: Commit verified source and pages without workflow mutations
        if: success() && steps.source.outputs.ready == 'true'
        run: |
          test "$GITHUB_REF_NAME" = 'reader-first-2026-10-21'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git diff --exit-code -- .github/workflows
          rm -f scripts/reader-first.patch.0[1-4] scripts/reader-first-followup.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'Implement and verify reader-first pathways v0.7.92 [skip reader] [skip build]'
          git push origin "HEAD:$GITHUB_REF_NAME"
