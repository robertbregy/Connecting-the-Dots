name: Rebuild published site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '.github/workflows/rebuild.yml'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'data/translations.json'
      - 'data/sanctions_explainer.json'
      - 'data/release_history.json'
      - 'publication.json'
      - 'build.py'

permissions:
  contents: write

concurrency:
  group: connecting-the-dots-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Rebuild and validate publication
        run: python3 build.py

      - name: Validate multilingual publication and delivery
        run: |
          node scripts/validate_multilingual.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js

      - name: Commit generated publication
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild published site [skip build]"
          # Rebase a generated commit on any intervening human/editorial changes.
          # Without this, rapid updates can produce a false red build after tests pass.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
