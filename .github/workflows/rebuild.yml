name: Rebuild published site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'docs/editorial-review-*.json'
      - '.github/workflows/rebuild.yml'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'data/behind_round_stories.json'
      - 'data/inside_the_round_events.json'
      - 'data/audit_20261018_editorial.json'
      - 'data/cultural_*.json'
      - 'data/audience_editorial.json'
      - 'data/economics_reading_order.json'
      - 'data/reader_pathways.json'
      - 'data/independent_review_materials.json'
      - 'data/cultural_blind_review_v2.csv'
      - 'data/tld_cultural_editorial.json'
      - 'data/aps_2026_applicant_sector_evidence.json'
      - 'data/domain_governance_glossary.csv'
      - 'data/registry_concentration.csv'
      - 'research/connecting-the-dots-working-paper-v1.md'
      - 'data/translations.json'
      - 'data/sanctions_explainer.json'
      - 'data/internet_access_explainer.json'
      - 'data/field_investigations.json'
      - 'data/city_namespace_editorial.json'
      - 'data/release_history.json'
      - 'data/applications_2026_aps_official_listing.csv'
      - 'data/applications_2026_aps_official_provenance.json'
      - 'data/application_2026_snapshot.json'
      - 'publication.json'
      - 'build.py'

permissions:
  contents: write

concurrency:
  group: connecting-the-dots-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Rebuild and validate publication
        run: python3 build.py

      - name: Validate multilingual publication and delivery
        run: |
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js

      - name: Verify reproducible current ZIP and unchanged historical archive
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root=pathlib.Path.cwd()
          pub=json.loads((root/'publication.json').read_text())
          current=root/pub['currentDataPackPath']
          historic=root/'downloads/connecting-the-dots-data-pack.zip'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before_current,before_historic=sha(current),sha(historic)
          research_files=[root/'research'/name for name in (
              'connecting-the-dots-working-paper-v1.md',
              'connecting-the-dots-working-paper-v1.html','index.html')]
          before_research={str(p.relative_to(root)):sha(p) for p in research_files}
          subprocess.run([sys.executable,'build.py'],check=True)
          after_current,after_historic=sha(current),sha(historic)
          if before_current!=after_current:
              raise SystemExit('NON-DETERMINISTIC DATA ZIP: same source produced different bytes')
          if before_historic!=after_historic:
              raise SystemExit('HISTORICAL ZIP WAS MODIFIED')
          after_research={str(p.relative_to(root)):sha(p) for p in research_files}
          if before_research!=after_research:
              raise SystemExit('NON-DETERMINISTIC RESEARCH RENDER: repeated build changed manuscript bytes')
          print('DETERMINISTIC_ZIP_VERIFIED',pub['version'],before_current)
          print('FROZEN_LEGACY_ZIP_PRESERVED',pub['dataPackageVersion'],before_historic)
          print('DETERMINISTIC_RESEARCH_VERIFIED',before_research)
          PY

      - name: Commit generated publication on unchanged branch tip
        # Publish verified build artifacts to the triggering branch, including main.
        # A changed branch tip is never overwritten; a newer push owns its rebuild.
        # The generated commit includes [skip build] to prevent a rebuild loop.
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No generated changes."
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          REMOTE_TIP="$(git rev-parse FETCH_HEAD)"
          LOCAL_TIP="$(git rev-parse HEAD)"
          if test "$REMOTE_TIP" != "$LOCAL_TIP"; then
            echo "::notice::Branch advanced during build; do not rebase generated outputs onto newer source. A later build will generate the current tip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes after staging."
            exit 0
          fi
          git commit -m "Rebuild published site [skip build]"
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::notice::Branch changed while pushing generated artifacts; defer to the next build. No force push, no rebase and no merge."
          fi
