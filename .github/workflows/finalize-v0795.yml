name: Publish readiness v0.7.95 - stable anchors and original regression suite
on:
  push:
    branches: ['feat/wikileaks-access-20261105']
    paths: ['.github/workflows/finalize-v0795.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Patch only stable anchor assignments in the current generator
        run: node scripts/fix_wikileaks_anchors_v0795.cjs
      - name: Rebuild the presentation using its original v0.7.95 data-bundle provenance
        # Anchors are a presentation-only correction. Keep the reviewed data-pack
        # source identity and its checksum untouched, not a new research snapshot.
        run: GITHUB_SHA=ce4572966a7c832b7f255ea0cafff8dbd0776fc7 python3 build.py
      - name: Review affected pages, previous public links and exact hashes
        run: node scripts/review_wikileaks_anchors_v0795.cjs
      - name: Run existing integrity, translation and functional source gates unchanged
        run: |
          node scripts/verify_ia_b2_parity.cjs
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
      - name: Verify original A/B content and immutable archives
        run: |
          mkdir -p ../baseline
          git archive refs/remotes/origin/safety/main-v0.7.78-before-b2-switch-20261013 | tar -xf - -C ../baseline
          python3 scripts/audit_content_continuity.py
      - name: Make reviewed candidate patch without overwriting any branch
        run: |
          git add scripts/reader_first.cjs docs/editorial-review-2026-11-05-v0.7.95.json docs/reader-first-structure.json docs/v0795-anchor-compatibility-review.json index.html en/index.html it/index.html de/index.html fr/index.html behind-the-round/en/who-controls-internet-access/index.html behind-the-round/it/who-controls-internet-access/index.html behind-the-round/de/who-controls-internet-access/index.html behind-the-round/fr/who-controls-internet-access/index.html
          git diff --cached --binary > w95-reviewed.patch
          test -s w95-reviewed.patch
          echo 'Reviewed candidate patch prepared'
      - uses: actions/upload-artifact@v4
        with:
          name: w95-reviewed-candidate
          path: w95-reviewed.patch
          retention-days: 7
  regression:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [layout, export-settled, export-cold, economics, navigation, legacy-links, accessibility, usability-remediation]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: w95-reviewed-candidate
          path: .
      - name: Apply only the reviewed verified candidate
        run: git apply --check w95-reviewed.patch && git apply w95-reviewed.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original regression dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Independently execute original, unmodified regression check
        env:
          CTD_CHECK: ${{ matrix.check }}
          CTD_TEST_BASE: http://127.0.0.1:8123/
          CTD_AUDIT_OUTPUT: audit-20261018
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ctd-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python3 - <<'PY'
          import importlib.util,json,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('regressions','scripts/run_browser_regressions.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          match=[r for r in mod.CHECKS if r[0]==os.environ['CTD_CHECK']]
          assert len(match)==1
          name,script,env=match[0]
          result=subprocess.run(['node',script],env={**os.environ,**env},timeout=1160)
          status={'check':name,'script':script,'exitCode':result.returncode,'passed':result.returncode==0}
          pathlib.Path('w95-qa-result.json').write_text(json.dumps(status,indent=2)+'\n')
          print(status)
          raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w95-acceptance-${{ matrix.check }}
          path: |
            w95-qa-result.json
            audit-usability/report.json
            audit-20261018/report.json
            audit-20261018-cold/report.json
            audit-deeplinks/results.json
          if-no-files-found: warn
  verified-candidate:
    needs: [prepare, regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: w95-reviewed-candidate
          path: .
      - name: Commit only tested candidate to unchanged development branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          test "$BRANCH" = 'feat/wikileaks-access-20261105'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD" || { echo 'Branch changed; do not overwrite'; exit 1; }
          git apply --check w95-reviewed.patch
          git apply w95-reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/reader_first.cjs docs/editorial-review-2026-11-05-v0.7.95.json docs/reader-first-structure.json docs/v0795-anchor-compatibility-review.json index.html en/index.html it/index.html de/index.html fr/index.html behind-the-round/en/who-controls-internet-access/index.html behind-the-round/it/who-controls-internet-access/index.html behind-the-round/de/who-controls-internet-access/index.html behind-the-round/fr/who-controls-internet-access/index.html
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'fix: preserve published access-guide anchors; original browser regressions verified [skip build]'
          git push origin "HEAD:$BRANCH"
          echo "VERIFIED_CANDIDATE=$(git rev-parse HEAD)"
