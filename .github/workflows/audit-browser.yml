name: Independent browser audit

on:
  push:
    branches:
      - 'audit/**'
    paths:
      - '.github/workflows/audit-browser.yml'
      - 'scripts/audit_browser_20261010.js'
      - 'scripts/audit_axe_20261010.js'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Audit local, fully built v0.7.71 in real Chromium
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ctd-audit-http.log 2>&1 &
          sleep 2
          node scripts/audit_browser_20261010.js
          node scripts/audit_axe_20261010.js
      - name: Attach visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-browser-audit-20261010
          path: audit-*.png
          if-no-files-found: ignore
