name: Full browser and WCAG regression audit

on:
  push:
    branches:
      - 'feat/**'
      - 'audit/**'
      - main
    paths:
      - '.github/workflows/audit-browser.yml'
      - 'scripts/**'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'downloads/**'
      - 'applications/**'
      - 'inside-the-round/**'
      - 'behind-the-round/**'
      - 'explorer/**'
      - 'research/**'
      - 'it/**'
      - 'en/**'
      - 'de/**'
      - 'fr/**'
      - 'index.html'
      - 'publication.json'
      - 'build.py'

permissions:
  contents: read

# Avoid launching obsolete 160-case audits after newer feature commits.
concurrency:
  group: ctd-full-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Build current release and validate all release invariants
        run: |
          python3 build.py
          if test "$GITHUB_REF_NAME" = "feat/ia-rearchitecture-20261012"; then
            node scripts/verify_ia_b2_parity.cjs
          fi
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
      - name: Audit actual Chromium layout, navigation and interactive behavior
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ctd-audit-http.log 2>&1 &
          sleep 2
          node scripts/audit_browser_20261010.js
      - name: Audit all 160 combinations of locale, theme and section for WCAG A/AA
        run: |
          node scripts/audit_axe_20261010.js
      - name: Independent four-language, all-tab and Explorer regression audit
        run: |
          node scripts/deep_audit_20261011.js
      - name: Verify interactive application atlas (all languages + mobile)
        run: |
          node scripts/audit_aps_application_atlas.js
      - name: Attach visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-browser-audit-${{ github.sha }}
          path: |
            audit-*.png
            audit-independent-20261011.json
            audit-aps-atlas-*.png
          if-no-files-found: ignore
