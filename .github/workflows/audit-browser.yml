name: Full browser and WCAG regression audit

on:
  push:
    branches:
      - 'feat/**'
      - 'audit/**'
      - main
    paths:
      - 'docs/editorial-review-*.json'
      - '.github/workflows/audit-browser.yml'
      - 'scripts/**'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - 'downloads/**'
      - 'applications/**'
      - 'inside-the-round/**'
      - 'behind-the-round/**'
      - 'explorer/**'
      - 'research/**'
      - 'it/**'
      - 'en/**'
      - 'de/**'
      - 'fr/**'
      - 'index.html'
      - 'publication.json'
      - 'build.py'

permissions:
  contents: read

concurrency:
  group: ctd-full-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Build current release and validate all release invariants
        run: |
          python3 build.py
          python3 scripts/test_aps_current_analytics.py
          node scripts/verify_ia_b2_parity.cjs
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
      - name: Run independent browser checks and retain every outcome
        env:
          CTD_TEST_BASE: http://127.0.0.1:8123/
          CTD_AUDIT_OUTPUT: audit-20261018
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ctd-audit-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          python3 scripts/run_browser_regressions.py
      - name: Attach visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-browser-audit-${{ github.sha }}
          path: |
            audit-*.png
            audit-independent-20261011.json
            audit-ia-b2/report.json
            audit-ia-b2/*.png
            audit-deeplinks/results.json
            audit-aps-atlas-*.png
            audit-20261018/report.json
            audit-20261018-cold/report.json
            audit-regression-status.json
            audit-regression-logs/
            audit-usability/
          if-no-files-found: ignore

  independent-qa:
    name: Independent four-language and Explorer audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Build and independently audit every language, route and Explorer
        run: |
          python3 build.py
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ctd-independent-http.log 2>&1 &
          sleep 2
          node scripts/deep_audit_20261011.js
      - name: Preserve independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-independent-audit-${{ github.sha }}
          path: |
            audit-independent-20261011.json
            audit-independent-*.png
          if-no-files-found: ignore

  atlas-qa:
    name: APS Atlas all-language interaction and mobile regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Build and verify interactive application atlas in all languages
        run: |
          python3 build.py
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ctd-atlas-http.log 2>&1 &
          sleep 2
          node scripts/audit_aps_application_atlas.js
      - name: Preserve atlas audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-aps-atlas-${{ github.sha }}
          path: |
            audit-aps-atlas-*.png
          if-no-files-found: ignore

  city-namespace-qa:
    name: City namespace four-language and accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Verify native governance, metrics, Lugano and reception links
        run: |
          python3 build.py
          python3 -m http.server 8128 --bind 127.0.0.1 > /tmp/ctd-city-http.log 2>&1 &
          sleep 2
          node scripts/audit_city_namespace.cjs
      - name: Preserve city-domain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctd-city-namespace-${{ github.sha }}
          path: dist/city-namespace-qa/
          if-no-files-found: ignore

  remediation-qa:
    name: Audit corrections, mobile semantics and controlled performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Build and check source invariants
        run: |
          python3 build.py
          node scripts/verify_ia_b2_parity.cjs
      - name: Verify audit corrections and controlled cold loads
        env:
          CTD_TEST_BASE: http://127.0.0.1:8123/
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/audit19-http.log 2>&1 &
          sleep 2
          audit_status=0
          node scripts/audit_20261019_browser.cjs || audit_status=1
          node scripts/audit_audience.cjs || audit_status=1
          node scripts/audit_performance_20261019.cjs || audit_status=1
          exit "$audit_status"
      - name: Preserve measurements and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-${{ github.sha }}
          path: audit-20261019/
          if-no-files-found: warn
