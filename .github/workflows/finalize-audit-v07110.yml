name: Finalize reviewed v0.7.110 full-audit candidate

on:
  push:
    branches: ['audit/full-v07110']
    paths: ['.github/workflows/finalize-audit-v07110.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pin review path and build provenance for this explicit candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          p=pathlib.Path('publication.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['version']=='0.7.110'
          data['editorialReviewPath']='docs/editorial-review-2026-11-11-v0.7.110.json'
          data['buildProvenanceCommit']=os.environ['SOURCE_COMMIT']
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          current=pathlib.Path(data['editorialReviewPath'])
          if not current.exists():
              shutil.copyfile('docs/editorial-review-2026-11-11-v0.7.109.json',current)
          print('REVIEW_PROVENANCE_PINNED',data['buildProvenanceCommit'])
          PY
      - name: Regenerate exact publication candidate
        run: python3 build.py
      - name: Record explicit reviewed hashes
        run: node scripts/finalize_audit_review_v07110.cjs --record-reviewed-candidate
      - name: Materialize frozen A baseline for continuity audit
        run: |
          git fetch origin refs/heads/safety/main-v0.7.78-before-b2-switch-20261013:refs/remotes/origin/safety/main-v0.7.78-before-b2-switch-20261013
          rm -rf ../baseline
          git worktree add --detach ../baseline refs/remotes/origin/safety/main-v0.7.78-before-b2-switch-20261013
      - name: Refresh continuity evidence
        run: python3 scripts/audit_content_continuity.py
      - name: Verify reviewed candidate
        run: |
          python3 scripts/test_external_source_health.py
          node scripts/verify_ia_b2_parity.cjs
          python3 scripts/release_check.py
          node scripts/validate_multilingual.js
          node scripts/validate_discovery.cjs
      - name: Commit only the reviewed candidate if branch tip is unchanged
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD" || { echo "::error::Branch advanced; refuse to overwrite newer work."; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'review: record verified v0.7.110 full-audit candidate [skip build]'
          git push origin "HEAD:$BRANCH"

# rerun-token: full-audit-closure-seo-guardrail
