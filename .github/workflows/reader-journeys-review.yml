name: Reader journey review
on:
  push:
    branches: [work/reader-journeys-20261020]
    paths: ['.github/workflows/reader-journeys-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          tar -czf /tmp/reader-tooling.tar.gz node_modules .github
      - uses: actions/upload-artifact@v4
        with:
          name: reader-review-tooling
          path: /tmp/reader-tooling.tar.gz
          retention-days: 1
