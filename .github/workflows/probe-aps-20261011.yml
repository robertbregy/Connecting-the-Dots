name: Probe ICANN official APS CSV (read-only)
on:
  push:
    branches:
      - research/aps-official-export-20261011
    paths:
      - '.github/workflows/probe-aps-20261011.yml'
      - 'scripts/probe_aps_20261011.js'
      - 'scripts/reconcile_aps_csv.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Discover official APS applications CSV export
        run: node scripts/probe_aps_20261011.js
      - name: Reconcile APS CSV IDs and -R replacement rows
        run: python3 scripts/reconcile_aps_csv.py
      - name: Preserve the CSV, evidence and diagnostics as a private CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-official-csv-probe-20261011
          path: artifacts/aps-probe/
          retention-days: 14
