name: CSV export isolation audit
on:
  push:
    branches: ['qa/full-usability-20261022']
    paths: ['.github/workflows/export-isolation-audit.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '90d21e6059871c36148e1860d017e7409ed3f8bb'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          timeout 150 npm ci --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
          timeout 180 npm install --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Verify CSV payloads independently from documented background graph loading
        env:
          CTD_TEST_BASE: http://127.0.0.1:8123/
          CTD_ECONOMICS_QA: export-audit/economics
        run: |
          mkdir -p export-audit
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/export-http.log 2>&1 &
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          s=Path('scripts/audit_20261018_browser.cjs').read_text()
          old="const contextDetail=page.locator('#lugano-governance-decisions details.editorialDetails');"
          new="assert.equal(await page.locator('#lugano [data-i18n=\"luganoWhyTitle\"]').evaluate(n=>n.closest('details')),null); const contextDetail=page.locator('#lugano-city-comparison');"
          assert s.count(old)==1;s=s.replace(old,new)
          assertion="assert.deepEqual(requests.slice(before),[],'Export fetched HTTP resources instead of using the visible dataset');"
          assert s.count(assertion)==1
          cold=s.replace(assertion,"const during=requests.slice(before); console.log('EXPORT_REQUEST_ATTRIBUTION '+JSON.stringify({url:page.url(),requests:during})); assert.deepEqual(during.filter(url=>!url.endsWith('/data/aps_2026_application_graph.js')&&!url.endsWith('/assets/aps-atlas.js')),[],'Unexpected HTTP resource during export');")
          Path('scripts/audit_20261018_export_attributed.cjs').write_text(cold)
          old='async function downloadCSV(page,requests){\n const before=requests.length;'
          new='''async function downloadCSV(page,requests){
           const beforeWarmup=requests.length;
           assert.equal(await page.evaluate(()=>window.CTD_LOAD_APS(true)),true,'Atlas must settle before isolating the export action');
           await page.waitForLoadState('networkidle');
           console.log('EXPORT_WARMUP '+JSON.stringify({url:page.url(),requests:requests.slice(beforeWarmup)}));
           const before=requests.length;'''
          assert s.count(old)==1
          Path('scripts/audit_20261018_export_settled.cjs').write_text(s.replace(old,new))
          import os
          results=[]
          for mode in ['attributed','settled']:
              env=dict(os.environ,CTD_AUDIT_OUTPUT='export-audit/'+mode)
              with Path('export-audit/'+mode+'.log').open('w') as log:
                  r=subprocess.run(['node','scripts/audit_20261018_export_'+mode+'.cjs'],env=env,stdout=log,stderr=subprocess.STDOUT,timeout=260)
              results.append({'mode':mode,'exitCode':r.returncode})
          Path('export-audit/results.json').write_text(json.dumps({'testedCommit':'90d21e6059871c36148e1860d017e7409ed3f8bb','siteModified':False,'runs':results},indent=2))
          Path('export-audit/method.txt').write_text('Two independent diagnostic conditions on unchanged published code. Attributed: retain CSV content and provenance assertions, record all requests and allow only the two explicitly named Atlas resources; other HTTP traffic fails. Settled: explicitly await the existing Atlas load promise before exporting, retain the original zero-HTTP assertion without exemptions. Both use all four languages and two widths. This measures export correctness and causal separation, not a claim that cold navigation has no background traffic.\n')
          assert all(r['exitCode']==0 for r in results),results
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-audit-export-isolation
          path: export-audit/
          retention-days: 30
