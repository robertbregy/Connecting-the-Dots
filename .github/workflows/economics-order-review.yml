name: Economics reading-order review
on:
  push:
    branches: [work/economics-order-20261020]
    paths:
      - '.github/workflows/economics-order-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source for local editorial tests
        run: git archive --format=zip HEAD -o /tmp/economics-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: economics-source
          path: /tmp/economics-source.zip
          retention-days: 3
