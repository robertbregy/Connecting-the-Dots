name: Economics reading-order review
on:
  push:
    branches: [work/economics-order-20261020]
    paths:
      - '.github/workflows/economics-order-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build and browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Apply bounded Economics source migration
        run: python3 scripts/prepare_economics_order.py
      - name: Build and validate the complete publication
        run: |
          python3 build.py
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
      - name: Compare original Economics text and source links independently
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict'),{execFileSync}=require('child_process'),{parseHTML}=require('linkedom');
          const base='ad9cb0de2e5f8c0ea9771509f003e4f3011ddcc1';
          function inventory(markup){const {document}=parseHTML(markup),sec=document.getElementById('economics');for(const n of sec.querySelectorAll('nav.sectionToc'))n.remove();const text=new Map();function walk(n){if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ').trim();if(t)text.set(t,(text.get(t)||0)+1)}else for(const c of n.childNodes)walk(c)}walk(sec);const links=new Map();for(const a of sec.querySelectorAll('a[href]')){const k=a.getAttribute('href');links.set(k,(links.get(k)||0)+1)}return {text,links,ids:[...sec.querySelectorAll('[id]')].map(n=>n.id)}}
          const evidence=[];
          for(const f of ['index.html','it/index.html','en/index.html','de/index.html','fr/index.html']){
            const old=inventory(execFileSync('git',['show',base+':'+f],{encoding:'utf8',maxBuffer:20000000})),now=inventory(fs.readFileSync(f,'utf8'));
            for(const kind of ['text','links'])for(const [value,n] of old[kind])assert.ok((now[kind].get(value)||0)>=n,f+' lost '+kind+': '+value.slice(0,120));
            for(const id of old.ids)assert.ok(now.ids.includes(id),f+' lost ID '+id);
            evidence.push({file:f,retainedTextSegments:old.text.size,retainedSourceDestinations:old.links.size,retainedIds:old.ids.length});
          }
          fs.mkdirSync('/tmp/ctd-economics-order',{recursive:true});fs.writeFileSync('/tmp/ctd-economics-order/preservation.json',JSON.stringify(evidence,null,2));console.log('ORIGINAL_ECONOMICS_PRESERVED',JSON.stringify(evidence));
          JS
      - name: Start local publication
        run: |
          python3 -m http.server 8128 --bind 127.0.0.1 > /tmp/economics-http.log 2>&1 &
          sleep 2
      - name: Test all languages, old links, keyboard, themes and rankings
        env:
          CTD_TEST_BASE: http://127.0.0.1:8128/
        run: |
          node scripts/audit_economics_order.cjs
          CTD_AUDIT_OUTPUT=/tmp/economics-prior-audit node scripts/audit_20261018_browser.cjs
      - name: Review exact output fingerprints and verify archive protection
        run: |
          python3 scripts/prepare_economics_order.py finalize
          node scripts/verify_ia_b2_parity.cjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('downloads/connecting-the-dots-data-pack-v0.7.91.zip');before=hashlib.sha256(p.read_bytes()).hexdigest()
          subprocess.run(['python3','build.py'],check=True)
          assert hashlib.sha256(p.read_bytes()).hexdigest()==before,'Non-deterministic package'
          PY
          node scripts/verify_ia_b2_parity.cjs
      - name: Commit verified candidate without changing main
        run: |
          test "$(git ls-remote origin refs/heads/work/economics-order-20261020 | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence={'version':'0.7.91','date':'2026-10-20','baselineCommit':'ad9cb0de2e5f8c0ea9771509f003e4f3011ddcc1','preservation':json.loads(Path('/tmp/ctd-economics-order/preservation.json').read_text()),'browser':json.loads(Path('/tmp/ctd-economics-order/report.json').read_text()),'archives':'RR1/RR2 and all 15 previously published technical ZIPs unchanged','publication':'Candidate verified; live deployment is checked separately.'}
          Path('docs/economics-order-verification-20261020.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          PY
          rm .github/workflows/economics-order-review.yml scripts/prepare_economics_order.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish v0.7.91: six-step Economics reading order [skip build]'
          git push origin HEAD:work/economics-order-20261020
          git rev-parse HEAD
      - name: Preserve browser and content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-order-qa
          path: |
            /tmp/ctd-economics-order/
            /tmp/economics-prior-audit/
          retention-days: 7
          if-no-files-found: warn
