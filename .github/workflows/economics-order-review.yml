name: Economics reading-order review
on:
  push:
    branches: [work/economics-order-20261020]
    paths:
      - '.github/workflows/economics-order-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and test dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          tar -czf /tmp/economics-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: economics-dependencies
          path: /tmp/economics-dependencies.tar.gz
          retention-days: 3
