name: Prepare Helsinki v0.7.80 candidate
on:
  push:
    branches:
      - feat/helsinki-20261013
    paths:
      - '.github/workflows/b2-release-rc.yml'
      - 'src/**'
      - 'scripts/release_check.py'
      - 'publication.json'
      - 'research/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build candidate and validate data, publication and scientific references
        run: |
          python3 build.py
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js
          python3 scripts/release_check.py
      - name: Commit generated candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Helsinki v0.7.80 release candidate [skip build]"
          git push origin "HEAD:feat/helsinki-20261013"
