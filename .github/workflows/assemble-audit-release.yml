name: Assemble reviewed audit release v0.7.98

on:
  push:
    branches: ['qa/assemble-v0798-20261106']

permissions:
  contents: write

concurrency:
  group: ctd-assemble-v0798-20261106
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  assemble:
    if: ${{ github.repository == 'robertbregy/Connecting-the-Dots' && github.ref == 'refs/heads/qa/assemble-v0798-20261106' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact assembly source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require the dedicated branch and unchanged source tip
        run: |
          test "$GITHUB_REPOSITORY" = 'robertbregy/Connecting-the-Dots'
          test "$GITHUB_REF" = 'refs/heads/qa/assemble-v0798-20261106'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_tip="$(git ls-remote --exit-code origin refs/heads/qa/assemble-v0798-20261106 | cut -f1)"
          test "$remote_tip" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Rebuild and validate publication
        run: python3 build.py

      - name: Verify reproducible current ZIP and unchanged historical archive
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          root=pathlib.Path.cwd()
          pub=json.loads((root/'publication.json').read_text())
          current=root/pub['currentDataPackPath']
          historic=root/'downloads/connecting-the-dots-data-pack.zip'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before_current,before_historic=sha(current),sha(historic)
          research_files=[root/'research'/name for name in (
              'connecting-the-dots-working-paper-v1.md',
              'connecting-the-dots-working-paper-v1.html','index.html')]
          before_research={str(p.relative_to(root)):sha(p) for p in research_files}
          subprocess.run([sys.executable,'build.py'],check=True)
          after_current,after_historic=sha(current),sha(historic)
          if before_current!=after_current:
              raise SystemExit('NON-DETERMINISTIC DATA ZIP: same source produced different bytes')
          if before_historic!=after_historic:
              raise SystemExit('HISTORICAL ZIP WAS MODIFIED')
          after_research={str(p.relative_to(root)):sha(p) for p in research_files}
          if before_research!=after_research:
              raise SystemExit('NON-DETERMINISTIC RESEARCH RENDER: repeated build changed manuscript bytes')
          print('DETERMINISTIC_ZIP_VERIFIED',pub['version'],before_current)
          print('FROZEN_LEGACY_ZIP_PRESERVED',pub['dataPackageVersion'],before_historic)
          print('DETERMINISTIC_RESEARCH_VERIFIED',before_research)
          PY

      - name: Validate the final release and exact reviewed sources
        run: |
          python3 -c "import json; assert json.load(open('publication.json'))['version']=='0.7.98', 'Unexpected assembly version'"
          python3 scripts/release_check.py
          node scripts/verify_ia_b2_parity.cjs
          node scripts/validate_multilingual.js
          node scripts/validate_internet_access.js
          CTD_STATIC_ONLY=1 node scripts/validate_delivery.js

      - name: Remove this temporary workflow and push only the assembly branch
        run: |
          test "$GITHUB_REPOSITORY" = 'robertbregy/Connecting-the-Dots'
          test "$GITHUB_REF" = 'refs/heads/qa/assemble-v0798-20261106'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_tip="$(git ls-remote --exit-code origin refs/heads/qa/assemble-v0798-20261106 | cut -f1)"
          if test "$remote_tip" != "$GITHUB_SHA"; then
            echo '::error::The assembly branch advanced; the reviewed source will not be rebased or overwritten.'
            exit 1
          fi
          if test -n "$(git status --porcelain -- src scripts .github docs build.py publication.json package.json package-lock.json)"; then
            echo '::error::The build changed source, review, dependency or workflow files; refuse to commit.'
            exit 1
          fi
          git rm -- .github/workflows/assemble-audit-release.yml
          git add -A
          test "$(git diff --cached --name-status -- .github/workflows)" = $'D\t.github/workflows/assemble-audit-release.yml'
          git diff --cached --quiet -- src scripts docs build.py publication.json package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble audited release v0.7.98 [skip build]'
          test "$(git show -s --format=%P HEAD)" = "$GITHUB_SHA"
          if ! git push origin 'HEAD:refs/heads/qa/assemble-v0798-20261106'; then
            echo '::error::The assembled publication was not pushed; no retry, rebase or force push was attempted.'
            exit 1
          fi
          echo "Assembled commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
